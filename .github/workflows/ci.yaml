name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: wordle
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: wordle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wordle -d wordle_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://wordle:test-only@localhost:5432/wordle_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.26"
          enable-cache: true
      - run: uv sync --frozen --python python
      - run: make check
      - run: uv run --frozen pytest
      - run: make validate-render
      - run: docker build -t wordle-bot:ci .
