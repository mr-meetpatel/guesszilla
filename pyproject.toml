[project]
name = "wordle-platform"
version = "2.0.0"
requires-python = ">=3.14,<3.15"
dependencies = ["wordle-slack-bot"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/backend"]

[tool.uv.sources]
wordle-slack-bot = { workspace = true }

[dependency-groups]
dev = ["mypy>=1.18,<2", "pytest>=8.4,<10", "ruff>=0.14,<1", "types-requests>=2.32", "pyyaml>=6,<7", "jsonschema>=4.25,<5", "types-PyYAML>=6"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["apps/backend/src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["flask_smorest"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["wordle_bot.platform.api", "wordle_bot.platform.auth", "wordle_bot.platform.maintenance"]
# These two third-party libraries do not ship typed route/JWT decorators.
disable_error_code = ["untyped-decorator"]

[tool.pytest.ini_options]
testpaths = ["apps/backend/tests"]
markers = ["integration: requires disposable PostgreSQL", "e2e: backend workflows requiring disposable PostgreSQL"]
