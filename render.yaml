envVarGroups:
  - name: wordle-platform-common
    envVars:
      - key: ADMIN_PANEL_ENABLED
        value: "true"
      - key: DB_BACKEND
        value: supabase
      - key: COOKIE_SECURE
        value: "true"
      - key: WEB_WORKERS
        value: "1"
      - key: WORKER_POLL_SECONDS
        value: "2"
      - key: PUBLIC_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: CREDENTIAL_ENCRYPTION_KEYS
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
services:
  - type: web
    name: wordle-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: wordle-bot serve
    healthCheckPath: /health/ready
    envVars:
      - fromGroup: wordle-platform-common
      - key: PORT
        value: "8000"
  - type: worker
    name: wordle-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: wordle-bot worker
    envVars:
      - fromGroup: wordle-platform-common
  - type: worker
    name: wordle-scheduler
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: wordle-bot scheduler
    envVars:
      - fromGroup: wordle-platform-common
  - type: web
    name: wordle-admin
    runtime: docker
    plan: starter
    dockerfilePath: ./infra/admin.Dockerfile
    healthCheckPath: /health/live
    envVars:
      - key: API_UPSTREAM
        fromService:
          type: web
          name: wordle-api
          property: hostport
      - key: PORT
        value: "8080"
